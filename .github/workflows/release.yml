name: Release IPA

# Tag a version bump to publish a release: git tag v1.1 && git push origin v1.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          DEVELOPER_DIR=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          "$DEVELOPER_DIR/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Read version and verify tag
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' PodcastLearning/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' PodcastLearning/Info.plist)
          TAG="v$VERSION"
          SHARE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ShareExtension/Info.plist)
          if [ "$SHARE_VERSION" != "$VERSION" ]; then
            echo "::error::ShareExtension is $SHARE_VERSION; keep both Info.plists on $VERSION"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $VERSION (expected $TAG)"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      # No developer certificate: packaging adds ad-hoc entitlement claims for re-signing.
      - name: Build app and share extension
        run: |
          set -euo pipefail
          xcodebuild -project PodcastLearning.xcodeproj -scheme PodcastLearning \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          ditto DerivedData/Build/Products/Release-iphoneos/PodcastLearning.app \
            build/Payload/PodcastLearning.app
          # SideStore drops profile entitlements absent from the incoming executable's signature.
          python3 - <<'PY'
          import plistlib
          import subprocess
          import tempfile
          from pathlib import Path

          app = Path("build/Payload/PodcastLearning.app")
          targets = [
              (app / "PlugIns/ShareExtension.appex", Path("ShareExtension/ShareExtension.entitlements")),
              (app, Path("PodcastLearning/PodcastLearning.entitlements")),
          ]
          groups = [plistlib.loads((bundle / "Info.plist").read_bytes()).get("AppGroupIdentifier")
                    for bundle, _ in targets]
          assert all(isinstance(group, str) and group.startswith("group.") and "$(" not in group
                     for group in groups), f"Missing or unresolved App Group: {groups}"
          assert groups[0] == groups[1], f"App and share extension groups differ: {groups}"
          with tempfile.TemporaryDirectory() as temporary:
              path = Path(temporary) / "Entitlements.plist"
              for (bundle, template), group in zip(targets, groups):
                  entitlements = plistlib.loads(template.read_bytes())
                  entitlements["com.apple.security.application-groups"] = [group]
                  data = plistlib.dumps(entitlements)
                  assert b"$(" not in data, f"Unresolved entitlement in {template}"
                  path.write_bytes(data)
                  subprocess.run(["codesign", "--force", "--sign", "-", "--timestamp=none",
                                  "--generate-entitlement-der", "--entitlements", str(path), str(bundle)], check=True)
                  signed = subprocess.check_output(["codesign", "--display", "--entitlements", "-", "--xml", str(bundle)])
                  assert plistlib.loads(signed) == entitlements, f"Lost entitlements in {bundle}"
                  subprocess.run(["codesign", "--verify", "--strict", str(bundle)], check=True)
          PY
          ditto -c -k --norsrc --noextattr --noqtn --keepParent \
            build/Payload "build/PodLearn-${VERSION}-unsigned.ipa"
          ls -lh build/*.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA="build/PodLearn-${VERSION}-unsigned.ipa"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" \
              --target "$GITHUB_SHA" \
              --title "PodLearn $VERSION" \
              --notes "Unsigned PodLearn $VERSION (build $BUILD). Install with SideStore or LiveContainer; either re-signs the IPA with your own Apple ID. Share extension included."
          fi

  # Keeps https://raw.githubusercontent.com/<repo>/main/source.json in sync so SideStore
  # users get an in-place update. Rebuilt from the releases API, so it self-heals.
  source:
    needs: ipa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Regenerate SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_source.py

      - name: Commit source.json
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json
          if git diff --cached --quiet; then
            echo 'source.json is already current'
            exit 0
          fi
          git commit -m 'Publish SideStore source update'
          git push
